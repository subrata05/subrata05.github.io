<article class="project-card">
  <div class="project-card-top"><span class="project-index">{{ include.project.number | default: "PROJECT" }}</span><span class="card-arrow">↗</span></div>
  <h3><a href="{{ include.project.url | relative_url }}">{{ include.project.title }}</a></h3>
  <p>{{ include.project.description }}</p>
  {% if include.project.technologies %}<div class="tag-list">{% for tech in include.project.technologies limit: 4 %}<span class="tag">{{ tech }}</span>{% endfor %}</div>{% endif %}
  <a class="card-link" href="{{ include.project.url | relative_url }}">Read project notes →</a>
</article>

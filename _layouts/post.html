---
layout: default
---
<article class="article-page">
  <a class="back-link" href="{{ '/blog/' | relative_url }}">← All writing</a>
  <header class="article-header">
    <p class="eyebrow">WRITING · {{ page.date | date: "%d %B %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}<p class="lead">{{ page.description }}</p>{% endif %}
  </header>
  <div class="prose">{{ content }}</div>
</article>
